# vuln-code-snippet start vulnerableDockerImageChallenge
services:
  nginx:
    image: nginx:1.28.0-alpine
    container_name: juice-shop-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - juice-shop
    networks:
      - juice-shop-net

  juice-shop:
    build:
      context: ../
      dockerfile: infrastructure/Dockerfile
    image: juice-shop:latest
    container_name: juice-shop-app
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - juice-shop-data:/juice-shop/data/sqlite
    networks:
      - juice-shop-net
    deploy:
      resources:
        limits:
          memory: 512M

  ai-assistant:
    build:
      context: ../python-fastapi
      dockerfile: Dockerfile
    container_name: juice-shop-ai-assistant
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      JUICE_SHOP_URL: http://juice-shop:3000
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      AI_ALLOWED_ORIGINS: http://localhost:3000,http://localhost
    ports:
      - "8000:8000"
    depends_on:
      chroma:
        condition: service_started
      juice-shop:
        condition: service_started
    networks:
      - juice-shop-net

  chroma:
    image: chromadb/chroma:latest
    container_name: juice-shop-chroma
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8001:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - juice-shop-net

  redis:
    image: redis:7.4.4-alpine
    container_name: juice-shop-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    expose:
      - "6379"
    networks:
      - juice-shop-net

  mongo:
    image: mongo:4.4.29 # vuln-code-snippet vuln-line vulnerableDockerImageChallenge
    container_name: juice-shop-mongo
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      MONGO_INITDB_DATABASE: juiceshop
    expose:
      - "27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - juice-shop-net

volumes:
  juice-shop-data:
    driver: local
  mongo-data:
    driver: local
  chroma-data:
    driver: local

networks:
  juice-shop-net:
    driver: bridge
# vuln-code-snippet end vulnerableDockerImageChallenge
